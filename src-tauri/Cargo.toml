[package]
name = "orga-neo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Personal organizer for seniors"

[workspace]
members = ["core"]

[lib]
name = "orga_neo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orga-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

# Optimise dependencies in development too: unoptimised Argon2 takes many seconds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
strip = true
