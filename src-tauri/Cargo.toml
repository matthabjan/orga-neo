[package]
name = "orga-neo"
version = "0.3.2"
edition = "2021"
license = "MIT"
description = "Personal organizer for seniors"

[workspace]
members = ["core"]

[lib]
name = "orga_neo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orga-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
log = "0.4"
tauri-plugin-log = "2.10.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dev-dependencies]
# Same version as tauri-plugin-updater uses, for the update error tests.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# The updater builds reqwest without a TLS crypto provider and installs ring itself; the tests do the same.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Optimise dependencies in development too: unoptimised Argon2 takes many seconds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
strip = true
