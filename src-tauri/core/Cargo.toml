[package]
name = "orga-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Storage and encryption layer of Orga-Neo"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
