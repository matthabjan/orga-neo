name: Build

# Documentation-only changes skip CI. Tag pushes always run: GitHub does not
# apply path filters to tags.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
    paths-ignore: ["README.md", "CLAUDE.md", "LICENSE"]
  pull_request:
    paths-ignore: ["README.md", "CLAUDE.md", "LICENSE"]
  workflow_dispatch:

# A newer push to the same branch or PR stops the run still going for the
# older one. Release runs (tags) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; only the release job may write.
#
# Third-party actions are pinned to commit SHAs (Dependabot updates them):
# the release job holds the update signing key, and a moved tag must not be
# able to reach it. Dependency install scripts are skipped for the same reason.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Storage and encryption tests
        run: cargo test -p orga-core
        working-directory: src-tauri

  # Pushes to main/develop and pull requests: an unsigned test installer. Pull requests
  # from forks get no secrets, so the updater artifacts (which need the signing
  # key) are switched off here.
  windows:
    needs: test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    # A test installer only needs to work, not to be small: skip link-time
    # optimisation and compile in parallel. Releases keep Cargo.toml's settings.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - name: Versions agree
        run: npm run release
      - name: Build installer
        shell: bash
        run: npm run tauri build -- --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orga-neo-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Tags v*: build, sign the update and publish a GitHub release with latest.json.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # The signing secrets live in this environment, which waits for approval.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions match the tag
        run: npm run release
      - name: Release notes from the tag message
        id: notes
        shell: bash
        run: |
          # checkout may leave a lightweight copy of the tag; fetch the annotated one
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo "body<<EOF_NOTES"
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Orga-Neo ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          updaterJsonPreferNsis: true
